# Example integration pinned to a specific RegressionProof commit.
# Copy to YOUR target project's .github/workflows/regressionproof.yml.
# Review the workflow and install your project's test dependencies before enabling it.
name: Regression comparison
on:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install target project's pytest and dependencies
        run: python -m pip install pytest
      - name: Install reviewed RegressionProof revision
        run: python -m pip install 'git+https://github.com/rahokul55/repocare-oss.git@e590978d874938d4c37b2c21e6cfb361ae4a084f'
      - name: Compare tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          regressionproof check --base "$BASE_SHA" --head HEAD --runs 2 \
            --test-command '{python} -m pytest -q --junitxml={report}' \
            --output .regressionproof
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regressionproof-report
          path: .regressionproof/
          if-no-files-found: ignore
