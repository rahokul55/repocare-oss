name: Pull request regression evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compare:
    name: Compare baseline and PR tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR merge commit with baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compare both revisions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m regressionproof check \
            --base "$BASE_SHA" \
            --head HEAD \
            --runs 2 \
            --schedule interleaved \
            --min-overlap 80 \
            --timeout 180 \
            --test-command '{python} -m pytest -q --junitxml={report}' \
            --github-summary \
            --output .regressionproof
      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regressionproof-pr-evidence
          path: .regressionproof/
          if-no-files-found: ignore
