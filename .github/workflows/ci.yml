name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Unit and Git integration tests
        run: python -m pytest -q
      - name: Package smoke test
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m regressionproof --version
          python -m regressionproof compare \
            --base-xml examples/base.xml \
            --head-xml examples/head.xml \
            --no-fail \
            --github-summary \
            --output .regressionproof
          test -s .regressionproof/result.json
          test -s .regressionproof/report.html
      - name: Upload example report
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: regressionproof-smoke-report
          path: .regressionproof/
          if-no-files-found: ignore
